# When new entries land on main, publish them as a GitHub Release.
# GitHub emails a release to everyone watching the repository's releases
# (Watch > Custom > Releases). No mail server and no secret needed.
name: Release new ripostes
on:
  push:
    branches: [main]
    paths: ["_includes/latest.md"]
  workflow_dispatch: # manual run: releases every entry currently on the page
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect the entries added in this push
        id: notes
        run: |
          before="${{ github.event.before }}"
          empty_tree=$(git hash-object -t tree /dev/null)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then before=$empty_tree; fi
          git diff --unified=0 "$before" HEAD -- _includes/latest.md \
            | grep '^+' | grep -v '^+++' | sed 's/^+//' > added.md || true
          if ! grep -q '^### ' added.md; then echo "none=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          titles=$(grep '^### ' added.md | sed 's/^### //' | paste -sd ';' - | sed 's/;/ ; /g')
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          {
            echo "Nouvelles ripostes du $(date -u '+%-d/%m/%Y'). Toutes les entrées : $site"
            echo
            cat added.md
          } > notes.md
          echo "title=Ripostes : $titles" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        if: steps.notes.outputs.none != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          gh release create "update-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" --title "${TITLE:0:250}" --notes-file notes.md
